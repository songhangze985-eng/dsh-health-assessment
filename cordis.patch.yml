# ============================================================================
# dsh-health-assessment 的 bundle patch
# ============================================================================
#
# 一行 insert：把插件挂进配置树。id 必须与 src/index.ts 的 `name` 一致，
# name 必须与本包 package.json 的 name 一致；商城预检按 id 行取值，
# 因此 id 行后面不能写行尾注释。
# ============================================================================

- insert:
    - id: health-assessment
      name: 'dsh-health-assessment'
